name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DHARMEQ_COPY_PLUGIN=ON

      - name: Build
        # Makefiles: a bare --parallel means unlimited "make -j", which exhausts the runner's memory.
        run: cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
            build/HarmEQ_artefacts/Release/VST3/HarmEQ.vst3

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: HarmEQ-macOS
          path: |
            build/HarmEQ_artefacts/Release/VST3/HarmEQ.vst3
            build/HarmEQ_artefacts/Release/Standalone/HarmEQ.app

  windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 10 --validate-in-process build/HarmEQ_artefacts/Release/VST3/HarmEQ.vst3

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: HarmEQ-Windows
          path: |
            build/HarmEQ_artefacts/Release/VST3/HarmEQ.vst3
            build/HarmEQ_artefacts/Release/Standalone/HarmEQ.exe
