name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DHARMEQ_COPY_PLUGIN=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: auval
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aumf Hreq Jokl

      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          for plugin in build/HarmEQ_artefacts/Release/VST3/HarmEQ.vst3 build/HarmEQ_artefacts/Release/AU/HarmEQ.component; do
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "$plugin"
          done

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: HarmEQ-macOS
          path: |
            build/HarmEQ_artefacts/Release/VST3/HarmEQ.vst3
            build/HarmEQ_artefacts/Release/AU/HarmEQ.component
